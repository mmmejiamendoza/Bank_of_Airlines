<div class="register-page">
  <div class="register-card">

    <div class="register-header">
      <h1>Create Account</h1>
      <p>Register for your banking account</p>
    </div>

    <form (ngSubmit)="onRegister()">

      <div class="name-row">
        <div class="form-group">
          <label for="firstName">First Name</label>

          <input id="firstName" name="firstName" type="text" [(ngModel)]="firstName" placeholder="First name"
            autocomplete="given-name" />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>

          <input id="lastName" name="lastName" type="text" [(ngModel)]="lastName" placeholder="Last name"
            autocomplete="family-name" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>

        <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="Enter your email"
          autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input id="password" name="password" type="password" [(ngModel)]="password" placeholder="Create a password"
          autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword"
          placeholder="Confirm your password" autocomplete="new-password" />
      </div>

      @if (errorMessage) {
      <div class="error-message">
        {{ errorMessage }}
      </div>
      }

      <button type="submit" [disabled]="isLoading">
        @if (isLoading) {
        Creating Account...
        } @else {
        Create Account
        }
      </button>

    </form>

    <div class="login-link">
      <p>
        Already have an account?
        <button type="button" class="link-button" (click)="goToLogin()">
          Sign In
        </button>
      </p>
    </div>

  </div>
</div>
