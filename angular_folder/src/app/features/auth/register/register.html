<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark">
        <span class="logo-blue"></span>
        <span class="logo-purple"></span>
        <span class="logo-red"></span>
      </div>

      <h1>BANK OF AIRLINES</h1>
    </div>

    <div class="auth-heading">
      <h2>Create an account</h2>
      <p>Register to get started with Bank of Airlines.</p>
    </div>

    @if (errorMessage) {
    <div class="error-message" role="alert">
      {{ errorMessage }}
    </div>
    }

    <form (ngSubmit)="onRegister()">

      <div class="form-row">

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" name="firstName" [(ngModel)]="firstName" placeholder="Enter your first name"
            autocomplete="given-name" />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" name="lastName" [(ngModel)]="lastName" placeholder="Enter your last name"
            autocomplete="family-name" />
        </div>

      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
          autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Create a password"
          autocomplete="new-password" />

        <small class="password-hint">
          Must contain at least 4 characters, 1 uppercase letter,
          1 lowercase letter, and 1 special character.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword"
          placeholder="Confirm your password" autocomplete="new-password" />
      </div>

      <button type="submit" class="auth-button" [disabled]="isLoading">
        @if (isLoading) {
        <span class="button-spinner"></span>
        Creating account...
        } @else {
        Create Account
        }
      </button>

    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>

      <button type="button" class="auth-link" (click)="goToLogin()">
        Log in
      </button>
    </div>

  </div>
</div>
