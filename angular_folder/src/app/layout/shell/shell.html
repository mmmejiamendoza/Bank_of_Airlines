<div class="shell">
  <app-navbar [menuOpen]="sidebarOpen()" (menuToggled)="toggleSidebar()" />
  <div class="shell__body">
    @if (sidebarOpen()) {
      <button class="shell__scrim" type="button" aria-label="Close menu" (click)="toggleSidebar()"></button>
    }
    <app-sidebar [open]="sidebarOpen()" />
    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
  <app-toast />
</div>
