<header class="navbar">
  <button
    class="navbar__menu"
    type="button"
    (click)="menuToggled.emit()"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-controls]="menuOpen() ? 'app-sidebar' : null"
    aria-label="Open menu"
  >
    <span></span><span></span><span></span>
  </button>

  <div class="navbar__brand">
    <span class="navbar__mark" aria-hidden="true">AA</span>
    <span class="navbar__title">{{ title() }}</span>
  </div>

  @if (userName()) {
  <div class="navbar__user">
    <button
      type="button"
      class="navbar__user-btn"
      aria-haspopup="menu"
      [attr.aria-expanded]="userMenuOpen()"
      (click)="toggleUserMenu()"
    >
      <span class="navbar__avatar" aria-hidden="true">{{ initial() }}</span>
      <span class="navbar__user-text">
        <strong>{{ userName() }}</strong>
        <small>{{ userId() }}</small>
      </span>
      <span class="navbar__caret" aria-hidden="true"></span>
    </button>

    @if (userMenuOpen()) {
      <div class="navbar__dropdown" role="menu">
        <button type="button" role="menuitem" (click)="logout()">Log out</button>
      </div>
    }
  </div>
}
</header>
